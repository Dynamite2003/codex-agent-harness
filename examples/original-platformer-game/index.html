<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skycap Run</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <div class="game-frame">
        <canvas id="game" width="960" height="540" aria-label="Skycap Run game canvas"></canvas>
        <div class="hud" aria-hidden="true">
          <span id="score">000000</span>
          <span id="coins">x00</span>
          <span id="lives">3</span>
          <span id="time">300</span>
        </div>
        <div id="overlay" class="overlay">
          <h1>Skycap Run</h1>
          <button id="start" type="button">开始</button>
        </div>
        <div class="touch-controls" aria-hidden="true">
          <div class="touch-pad">
            <button class="touch-btn" data-key="left" type="button">‹</button>
            <button class="touch-btn" data-key="right" type="button">›</button>
          </div>
          <button class="touch-btn jump" data-key="jump" type="button">↥</button>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
