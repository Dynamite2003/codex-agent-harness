<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deadline Todo Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #20242c;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        box-shadow: 0 12px 36px rgba(30, 42, 62, 0.08);
        padding: 24px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
      }

      form {
        display: grid;
        grid-template-columns: 1fr 168px auto;
        gap: 10px;
        align-items: start;
      }

      input,
      button {
        height: 40px;
        box-sizing: border-box;
        border-radius: 6px;
        font: inherit;
      }

      input {
        border: 1px solid #c8d0dc;
        padding: 0 10px;
      }

      button {
        border: 0;
        background: #1f6feb;
        color: #fff;
        padding: 0 14px;
        cursor: pointer;
      }

      button.secondary {
        background: #edf1f7;
        color: #263142;
      }

      .error {
        grid-column: 1 / -1;
        min-height: 20px;
        color: #b42318;
        font-size: 14px;
      }

      .summary {
        margin: 18px 0 10px;
        color: #576273;
        font-size: 14px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      li {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 10px;
        align-items: center;
        border: 1px solid #dce2eb;
        border-radius: 8px;
        padding: 10px;
      }

      li.overdue {
        border-color: #f2a29b;
        background: #fff7f6;
      }

      .title.done {
        color: #7d8796;
        text-decoration: line-through;
      }

      .meta {
        color: #687386;
        font-size: 13px;
      }

      .badge {
        border-radius: 999px;
        background: #fee4e2;
        color: #b42318;
        font-size: 12px;
        padding: 4px 8px;
      }

      .empty {
        border: 1px dashed #cbd3df;
        border-radius: 8px;
        color: #687386;
        padding: 18px;
        text-align: center;
      }

      @media (max-width: 680px) {
        form {
          grid-template-columns: 1fr;
        }

        li {
          grid-template-columns: auto 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Deadline Todo Demo</h1>
      <form id="todo-form">
        <input id="title-input" autocomplete="off" placeholder="Task title" />
        <input id="due-input" type="date" />
        <button type="submit">Add</button>
        <div class="error" id="error"></div>
      </form>
      <p class="summary" id="summary"></p>
      <ul id="todo-list"></ul>
      <div class="empty" id="empty-state" hidden>No tasks yet.</div>
    </main>

    <script>
      const storageKey = "vibe2spec-demo-todos";
      const form = document.querySelector("#todo-form");
      const titleInput = document.querySelector("#title-input");
      const dueInput = document.querySelector("#due-input");
      const error = document.querySelector("#error");
      const list = document.querySelector("#todo-list");
      const summary = document.querySelector("#summary");
      const emptyState = document.querySelector("#empty-state");

      let todos = loadTodos();

      function todayString() {
        return new Date().toISOString().slice(0, 10);
      }

      function isOverdue(todo, today = todayString()) {
        return Boolean(todo.dueDate && !todo.completed && todo.dueDate < today);
      }

      function loadTodos() {
        try {
          return JSON.parse(localStorage.getItem(storageKey) || "[]");
        } catch {
          return [];
        }
      }

      function saveTodos() {
        localStorage.setItem(storageKey, JSON.stringify(todos));
      }

      function addTodo(title, dueDate) {
        todos = [
          ...todos,
          {
            id: String(Date.now()),
            title,
            dueDate,
            completed: false,
          },
        ];
        saveTodos();
        render();
      }

      function toggleTodo(id) {
        todos = todos.map((todo) =>
          todo.id === id ? { ...todo, completed: !todo.completed } : todo,
        );
        saveTodos();
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter((todo) => todo.id !== id);
        saveTodos();
        render();
      }

      function render() {
        list.innerHTML = "";
        const overdueCount = todos.filter((todo) => isOverdue(todo)).length;
        summary.textContent = `${todos.length} task(s), ${overdueCount} overdue`;
        emptyState.hidden = todos.length > 0;

        for (const todo of todos) {
          const item = document.createElement("li");
          item.className = isOverdue(todo) ? "overdue" : "";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const title = document.createElement("div");
          title.className = todo.completed ? "title done" : "title";
          title.textContent = todo.title;

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = todo.dueDate ? `Due ${todo.dueDate}` : "No due date";

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "secondary";
          deleteButton.textContent = "Delete";
          deleteButton.addEventListener("click", () => deleteTodo(todo.id));

          item.append(checkbox, title, meta);
          if (isOverdue(todo)) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "Overdue";
            item.append(badge);
          }
          item.append(deleteButton);
          list.append(item);
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) {
          error.textContent = "Task title is required.";
          return;
        }
        error.textContent = "";
        addTodo(title, dueInput.value);
        form.reset();
        titleInput.focus();
      });

      render();
    </script>
  </body>
</html>
