<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprint Board Lite</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main id="app" class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Sprint planning workspace</p>
          <h1>Sprint Board Lite</h1>
        </div>
      </header>

      <section class="metrics" aria-label="Sprint metrics">
        <article class="metric">
          <span class="metric-label">Total tasks</span>
          <strong id="metric-total">0</strong>
        </article>
        <article class="metric">
          <span class="metric-label">Completion</span>
          <strong id="metric-completion">0%</strong>
        </article>
        <article class="metric">
          <span class="metric-label">Total effort</span>
          <strong id="metric-effort">0</strong>
        </article>
        <article class="metric">
          <span class="metric-label">Open high priority</span>
          <strong id="metric-high-priority">0</strong>
        </article>
      </section>

      <section class="workspace" aria-label="Task entry and controls">
        <form id="task-form" class="task-form">
          <h2>Add task</h2>

          <div class="form-grid">
            <div class="field">
              <label for="task-title">Title</label>
              <input id="task-title" name="title" type="text" autocomplete="off" required>
            </div>

            <div class="field">
              <label for="task-owner">Owner</label>
              <input id="task-owner" name="owner" type="text" autocomplete="off">
            </div>

            <div class="field">
              <label for="task-effort">Effort</label>
              <input id="task-effort" name="effort" type="number" min="0" step="0.5" value="1">
            </div>

            <div class="field">
              <label for="task-priority">Priority</label>
              <select id="task-priority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="field">
              <label for="task-status">Status</label>
              <select id="task-status" name="status">
                <option value="backlog" selected>Backlog</option>
                <option value="doing">Doing</option>
                <option value="review">Review</option>
                <option value="done">Done</option>
              </select>
            </div>

            <div class="field field-wide">
              <label for="task-notes">Notes</label>
              <textarea id="task-notes" name="notes" rows="3"></textarea>
            </div>
          </div>

          <button type="submit">Add task</button>
        </form>

        <section class="filters" aria-label="Board filters and data tools">
          <div class="filter-grid">
            <div class="field">
              <label for="search-input">Search</label>
              <input id="search-input" type="search" autocomplete="off">
            </div>

            <div class="field">
              <label for="status-filter">Status</label>
              <select id="status-filter">
                <option value="All" selected>All</option>
                <option value="backlog">Backlog</option>
                <option value="doing">Doing</option>
                <option value="review">Review</option>
                <option value="done">Done</option>
              </select>
            </div>

            <div class="field">
              <label for="owner-filter">Owner</label>
              <select id="owner-filter">
                <option value="All" selected>All</option>
              </select>
            </div>
          </div>

          <div class="data-actions">
            <button id="export-json" type="button">Export JSON</button>
            <button id="import-json" type="button">Import JSON</button>
            <label for="import-file">Import file</label>
            <input id="import-file" type="file" accept="application/json,.json">
          </div>

          <div id="feedback" class="feedback" aria-live="polite"></div>
        </section>
      </section>

      <section class="board" aria-label="Sprint board">
        <section class="column" data-status="backlog" aria-labelledby="column-backlog-title">
          <header class="column-header">
            <h2 id="column-backlog-title">Backlog</h2>
          </header>
          <div class="task-list" data-task-list="backlog"></div>
        </section>

        <section class="column" data-status="doing" aria-labelledby="column-doing-title">
          <header class="column-header">
            <h2 id="column-doing-title">Doing</h2>
          </header>
          <div class="task-list" data-task-list="doing"></div>
        </section>

        <section class="column" data-status="review" aria-labelledby="column-review-title">
          <header class="column-header">
            <h2 id="column-review-title">Review</h2>
          </header>
          <div class="task-list" data-task-list="review"></div>
        </section>

        <section class="column" data-status="done" aria-labelledby="column-done-title">
          <header class="column-header">
            <h2 id="column-done-title">Done</h2>
          </header>
          <div class="task-list" data-task-list="done"></div>
        </section>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
